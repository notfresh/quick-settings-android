plugins {
    id 'com.android.application'
    id 'app.cash.paparazzi' version '1.3.5'
}

android {
    namespace = "app.qtoggle"
    compileSdk = 34

    defaultConfig {
        applicationId = "app.qtoggle"
        minSdk = 24
        targetSdk = 34
        versionCode = 4
        versionName = "1.3"

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles(
                getDefaultProguardFile("proguard-android-optimize.txt"),
                "proguard-rules.pro"
            )
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.2.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    // Paparazzi — 用 layoutlib 在 JVM 上渲染 layout 出真截图(无需 emulator)。
    // 跑:./gradlew :app:recordPaparazziDebug   产物在 app/src/test/screenshots/
    testImplementation 'app.cash.paparazzi:paparazzi:1.3.5'
}
